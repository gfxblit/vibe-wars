<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy (CSP)
      - default-src 'self': Only allow resources from same origin by default
      - script-src 'self' 'unsafe-inline' 'unsafe-eval': Allow scripts from self. 'unsafe-inline' and 'unsafe-eval' are required for Vite dev mode. In a strict production build, these should be removed.
      - style-src 'self' 'unsafe-inline': Allow styles from self and inline styles (needed for JS dynamic styling).
      - img-src 'self' data:; Allow images from self and data URIs.
      - font-src 'self' data:; Allow fonts from self and data URIs.
      - connect-src 'self' ws: wss:; Allow connections to self and WebSockets (Vite HMR).
      - object-src 'none': Disable plugins like Flash.
      - base-uri 'self': Restrict <base> tag.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self';">
    <title>Vibe Wars</title>
  </head>
  <body>
    <div id="cursor">
      <svg width="50" height="50" viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="rotate(45 25 25)">
          <!-- Cyan Target Arrowheads (Hollow, Thin, Elongated) -->
          <!-- Top -->
          <path d="M20 4 L25 20 L30 4 Z" stroke="cyan" stroke-width="1.2" fill="none" />
          <!-- Bottom -->
          <path d="M20 46 L25 30 L30 46 Z" stroke="cyan" stroke-width="1.2" fill="none" />
          <!-- Left -->
          <path d="M4 20 L20 25 L4 30 Z" stroke="cyan" stroke-width="1.2" fill="none" />
          <!-- Right -->
          <path d="M46 20 L30 25 L46 30 Z" stroke="cyan" stroke-width="1.2" fill="none" />
        </g>
      </svg>
    </div>
    <button id="fire-button" aria-label="Fire Weapon">FIRE</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
